<div [ngClass]="{'dark':this.darkTheme,'light':!this.darkTheme}" id="contenedor">
    <app-encabezado></app-encabezado>
    <app-acerca-de></app-acerca-de>
    <app-informacion #info ></app-informacion>
    <app-footer></app-footer>
    <div>
        <router-outlet></router-outlet>
    </div>
    <app-cargando @cargando *ngIf="this.cargando"></app-cargando>
    <div @notificacion (@notificacion.done)="this.mensaje=false" *ngIf="this.mensaje" class="alert" [ngClass]="this.tipoAlerta"
        role="alert" id="notificacion">{{this.mensajeString}}</div>
</div>
