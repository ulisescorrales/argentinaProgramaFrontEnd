<footer [ngClass]="{'darkFooter':this.darkTheme}">
    <div class="container">        
        <div class="row align-items-center" id="fila">
            <div class="col">
                <p>{{dom?.ciudad}}, {{dom?.provincia}}, {{dom?.pais}}</p>
            </div>
            <div class="col text-center">                
                <button class="btn btn-light mensaje" [routerLink]="this.autenticado? 'mensaje/ver':'contacto'"  [innerText]="this.autenticado? 'Ver Mensajes':'Contacto'"></button>                
            </div>            
            <div class="col">
                <!--<button type="button" class="btn btn-outline-light float-end">CV</button>-->
            </div>
        </div>
    </div>
</footer>
