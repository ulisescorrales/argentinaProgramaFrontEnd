<!--CONOCIMIENTOS
Se incluyen tanto las tecnologías como otras habilidades que puedan incluirse
-->
<div section="conocimientos" class="informacion">
    <div class="container">
        <div class="row border-bottom">
            <div class="col text-center">
                <h2 class="titulo" data-aos="fade-right" data-aos-duration="1000" data-aos-delay="250">Conocimientos</h2>
            </div>
        </div>
        <div class="row" style="margin-top: 20px" *ngFor="let filas of filasArray;index as i">
            <div class="col text-center programa my-auto" *ngFor="let columnas of columnasArray; index as j" [ngSwitch]="j"
                id="grilla">
                <!--Cargar logo según su posición en la grilla-->
                <ng-template [ngIf]="columnas*i+j<tamanioKnowledge">
                    <article>
                    <figure>
                    <img class="logo" [src]="listTecnologia[columnas*i+j].logo"
                        style="width:45%;height:75%;" data-aos="flip-up" data-aos-duration="1000"
                        data-aos-delay="250">
                    <!--<img class="logo" *ngSwitchCase="1" [src]="listTecnologia[columnas*i+j].logo"
                        style="width:45%;height:75%;" data-aos="zoom-in" data-aos-duration="1000" data-aos-delay="250">
                    <img class="logo" *ngSwitchCase="2" [src]="listTecnologia[columnas*i+j].logo"
                        style="width:45%;height:75%;" data-aos="fade-left" data-aos-duration="1000"
                        data-aos-delay="250">-->
                    <!--Botones de edición de conocimiento-->
                    <div class="middle" *ngIf="editar">
                        <i class="fa-solid fa-pen" [ngClass]="this.darkTheme? 'remarcarDark':'remarcar'"
                            [routerLink]="['editar','conocimiento',listTecnologia[columnas*i+j].idTecnologia]"></i>
                        <i class="fa-sharp fa-solid fa-trash editar" data-aos="zoom-in" data-aos-duration="1000"
                            data-aos-delay="250" [ngClass]="this.darkTheme? 'remarcarDark':'remarcar'"
                            [routerLink]="['editar','eliminar','conocimiento',listTecnologia[columnas*i+j].idTecnologia]"></i>
                    </div>
                    <div class="middle" *ngIf="editar==false">
                        <figcaption>
                        <p data-aos="zoom-out" data-aos-duration="1000">
                            {{listTecnologia[columnas*i+j].nombre}}</p></figcaption>
                    </div>
                    </figure>
                    </article>
                </ng-template>
                <!--Cargar icono de editar, mejorar para cuando esté la grilla lena(se debe agregar una fila mas)-->
                <ng-template [ngIf]="3*i+(j)==tamanioKnowledge && editar">
                    <!--Cambia el data-aos según en que posición de la cuadrícula esté-->
                    <h2><i class="fa-solid fa-circle-plus" [ngClass]="this.darkTheme? 'remarcarDark':'remarcar'" data-aos="fade-out"
                            data-aos-duration="1000" data-aos-delay="250"
                            [routerLink]="['editar','agregar','conocimiento']"></i></h2>
                    <!--<h2><i *ngSwitchCase="1" class="fa-solid fa-circle-plus" [ngClass]="this.darkTheme? 'remarcarDark':'remarcar'" data-aos="zoom-in"
                            data-aos-duration="1000" data-aos-delay="250"
                            [routerLink]="['editar','agregar','conocimiento']"></i></h2>
                    <h2><i *ngSwitchCase="2" class="fa-solid fa-circle-plus" [ngClass]="this.darkTheme? 'remarcarDark':'remarcar'" data-aos="fade-left"
                            data-aos-duration="1000" data-aos-delay="250"
                            [routerLink]="['editar','agregar','conocimiento']"></i></h2>-->

                </ng-template>                                
            </div>
        </div>
    </div>
</div>
