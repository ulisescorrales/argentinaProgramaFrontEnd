<div section="experiencia" class="informacion">
    <div class="container">
        <div class="row">
            <div class="col text-center">
                <h2 class="titulo" data-aos="fade-right" data-aos-duration="1000" data-aos-delay="250">Experiencia</h2>
            </div>
        </div>
        <div class="row" *ngFor="let experiencia of listExperiencia" data-aos="fade-right"
            data-aos-duration="1000" data-aos-delay="250">
            <article>
                <div class="col">
                    <div class="row">
                        <span class="border-top"></span>
                        <!--Logo de la institución-->
                        <div class="col-2 primerRenglon">
                            <img [src]="experiencia.logo" class="rounded mx-auto d-block img-fluid logo" alt="Logo institución" />
                        </div>
                        <div class="col text-left primerRenglon">
                            <div class="row">
                                <div class="col-10 text-left contenido">
                                    <h2 class="tituloItem">{{experiencia.titulo}}</h2>
                                </div>
                                <!--Botones de edición-->
                                <div class="col-1 my-auto" *ngIf="editar">
                                    <i class="fa-solid fa-pen editar" [ngClass]="this.darkTheme? 'remarcarDark':'remarcar'"
                                        [routerLink]="['editar','experiencia',experiencia.idExperiencia]"></i>
                                    <i class="fa-sharp fa-solid fa-trash editar" [ngClass]="this.darkTheme? 'remarcarDark':'remarcar'"
                                        [routerLink]="['editar','eliminar','experiencia',experiencia.idExperiencia]"></i>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col">
                                    <p class="texto">Institución: {{experiencia.organizacion}}</p>
                                    <p class="texto">Inicio: {{experiencia.inicio}}</p>
                                    <p *ngIf="experiencia.fin!='' " class="texto">Fin: {{experiencia.fin}}</p>
                                    <p class="texto">{{experiencia.descripcion}}</p>
                                    <ul *ngFor="let tarea of experiencia.tareas">
                                        <li class="texto">{{tarea.descripcion}}
                                            <ul *ngIf="tarea.repositorio!=null">
                                                <li><a [ngClass]="{'darkLink':this.darkTheme}" class="texto"
                                                        [href]="tarea.repositorio">Repositorio</a></li>
                                            </ul>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </article>
        </div>
        <!--Botón de agregar experiencia-->
        <div class="row" *ngIf="editar">
            <div class="col text-center">
                <h2><i class="fa-solid fa-circle-plus" [ngClass]="this.darkTheme? 'remarcarDark':'remarcar'" data-aos="zoom-in"
                        data-aos-duration="1000" data-aos-delay="250"
                        [routerLink]="['editar','agregar','experiencia']"></i></h2>
            </div>
        </div>
    </div>
</div>
